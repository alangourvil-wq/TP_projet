<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page de détail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="nom-entreprise">Chargement...</h1>

    <!-- Bloc Notation de l'entreprise -->
    <section id="notation">
        <h2>Notation de l'entreprise</h2>

        <p>
            Note moyenne :
            <span id="note-moyenne">0</span> / 5
        </p>

        <div id="etoiles">
            <input type="radio" id="etoile5" name="note" value="5">
            <label for="etoile5">★</label>

            <input type="radio" id="etoile4" name="note" value="4">
            <label for="etoile4">★</label>

            <input type="radio" id="etoile3" name="note" value="3">
            <label for="etoile3">★</label>

            <input type="radio" id="etoile2" name="note" value="2">
            <label for="etoile2">★</label>

            <input type="radio" id="etoile1" name="note" value="1">
            <label for="etoile1">★</label>
        </div>

        <button id="btn-valider-note" type="button">Valider ma note</button>
        <p id="message-note"></p>
    </section>

    <h2>Employés</h2>

    <table border="1" id="table-employes">
        <tr>
            <td>Nom</td>
        </tr>
    </table>

    <hr>

    <p>Footer : copyright</p>

    <script src="script_details.js"></script>
</body>
</html>
